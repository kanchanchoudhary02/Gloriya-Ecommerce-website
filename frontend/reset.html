<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password – Gloriya Jewellery"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/style.css" rel="stylesheet"></head><body><main class="container py-5" style="max-width:520px"><div class="card border-0 shadow p-4"><h2>Reset Password</h2><form id="resetForm"><input id="password" type="password" minlength="6" class="form-control mb-2" placeholder="New password" required><input id="confirm" type="password" minlength="6" class="form-control mb-3" placeholder="Confirm password" required><button class="btn btn-dark w-100">Reset Password</button></form><div id="msg" class="mt-3"></div><a href="/login.html" class="d-inline-block mt-3">Back to Login</a></div></main><script>const API_BASE=window.API_BASE||'https://gloriya.in/api';const token=new URLSearchParams(location.search).get('token')||'';document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value,msg=document.getElementById('msg');if(p!==c){msg.className='mt-3 text-danger';msg.textContent='Passwords do not match.';return;}msg.textContent='Resetting...';try{const r=await fetch(API_BASE+'/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});const d=await r.json();msg.className='mt-3 '+(r.ok?'text-success':'text-danger');msg.textContent=d.msg||'Please try again.';if(r.ok)setTimeout(()=>location.href='/login.html',1200);}catch{msg.className='mt-3 text-danger';msg.textContent='Unable to contact the server.';}};</script></body></html>
