  <style>
    #reviewsCarousel.carousel-fade .carousel-item { transition: opacity .6s ease-in-out; }
    .product-card.new-arrival-card .overlay .badge { border-radius:999px; padding:.35rem .6rem; font-weight:600; }

    /* ================= TRENDING PRODUCTS ================= */
    .trending-section .section-title h2 {
      font-family: "Playfair Display", serif;
    }

    .trending-section .trending-card {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      height: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      transition: transform .3s ease, box-shadow .3s ease;
      border: 1px solid rgba(0,0,0,.05);
    }

    .trending-section .trending-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 18px 40px rgba(0,0,0,.13);
    }

    .trending-section .trending-img {
      position: relative;
      overflow: hidden;
      background: #f7f3f1;
    }

    .trending-section .trending-img img {
      width: 100%;
      height: 330px;
      object-fit: cover;
      display: block;
      transition: transform .5s ease;
    }

    .trending-section .trending-card:hover .trending-img img {
      transform: scale(1.05);
    }

    .trending-section .trending-label {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(255,255,255,.92);
      color: #2b1e1c;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      box-shadow: 0 5px 15px rgba(0,0,0,.08);
    }

    .trending-section .trending-info {
      padding: 18px 18px 20px;
      text-align: center;
    }

    .trending-section .trending-info h5 {
      font-family: "Playfair Display", serif;
      font-weight: 600;
      margin-bottom: 7px;
      color: #2b1e1c;
    }

    .trending-section .trending-price {
      color: #b27668;
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 14px;
    }

    .trending-section .trending-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      background: #d8a6a0;
      color: #241815;
      font-weight: 600;
      text-decoration: none;
      transition: .2s ease;
    }

    .trending-section .trending-btn:hover {
      transform: translateY(-1px);
      filter: brightness(.96);
    }

    .trending-section .carousel-control-prev,
    .trending-section .carousel-control-next {
      width: 42px;
      height: 42px;
      top: 45%;
      transform: translateY(-50%);
      background: rgba(43,30,28,.8);
      border-radius: 50%;
      opacity: 1;
    }

    .trending-section .carousel-control-prev {
      left: -5px;
    }

    .trending-section .carousel-control-next {
      right: -5px;
    }

    @media (max-width: 767px) {
      .trending-section .trending-img img {
        height: 280px;
      }

      .trending-section .carousel-control-prev {
        left: 5px;
      }

      .trending-section .carousel-control-next {
        right: 5px;
      }
    }
  </style>

  <meta name="viewport" content="width=device-width, initial-scale=1">
