<!doctype html>
<html lang="en" data-page="login">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gloriya Jewellery – Login</title>
  <meta name="description" content="Login to Gloriya — Handcrafted fine jewellery.">

  <!-- keep the same favicons/OG as before -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- libs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght:600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="/style.css" rel="stylesheet"/>

  <style>
    /* --- IMPORTANT: do not modify body flow or global layout --- */
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg,#f8f7f5 0%,#f2efec 100%);
      margin:0;
      color:#111;
    }

    /* Make sure login area is always visible below the navbar injected by partials-loader */
    .login-shell {
      /* Reserve space below header and above footer so the card is never pushed offscreen */
      min-height: calc(100vh - 140px); /* header+footer allowance; safe on most sites */
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 2.25rem 1rem;
      box-sizing: border-box;
    }

    .login-card {
      width:100%;
      max-width:420px;
      background: rgba(255,255,255,0.98);
      border-radius:12px;
      padding:1.6rem;
      border:1px solid rgba(0,0,0,0.04);
      box-shadow: 0 8px 24px rgba(15,15,15,0.06);
    }

    .brand { font-family: "Playfair Display", serif; display:flex; gap:.5rem; align-items:center; margin-bottom:.45rem; }
    .brand .dot { width:9px; height:9px; border-radius:50%; background:#b8860b; }

    input.form-control:focus { border-color:#b8860b; box-shadow:0 0 0 .12rem rgba(184,134,11,0.08); }
    .btn-modern { background: linear-gradient(90deg,#b8860b,#c49a2b); color:#fff; border-radius:8px; font-weight:600; padding:.55rem .9rem; border:0; }
    .field-error { color:#b00020; font-size:.9rem; margin-top:.35rem; display:none; }
    .field-error.visible { display:block; }

    /* Ensure card is visible on small screens */
    @media (max-width:420px) {
      .login-shell { padding:1rem; min-height: calc(100vh - 110px); }
      .login-card { padding:1rem; }
    }

    /* fallback if JS is disabled or partials-loader fails */
    .noscript-note { font-size:.95rem; color:#6b6b6b; margin-top:.5rem; }
  </style>

  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body data-page="login">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
