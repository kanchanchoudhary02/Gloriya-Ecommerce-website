<!doctype html>
<html lang="en" data-page="wishlist">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>My Wishlist | Gloriya Jewellery</title>

  <meta
    name="description"
    content="View your saved jewellery products on Gloriya Jewellery."
  >

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
  >

  <!-- Site CSS -->
  <link
    href="/style.css"
    rel="stylesheet"
  >

  <style>

    .wishlist-section {
      min-height: 70vh;
      padding: 70px 0;
      background: #fff;
    }

    .wishlist-title {
      font-family: "Playfair Display", serif;
      font-weight: 600;
      color: #2b1e1c;
    }

    .wishlist-subtitle {
      color: #777;
    }

    .wishlist-card {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(43, 30, 28, 0.08);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      height: 100%;
      transition: 0.25s ease;
    }

    .wishlist-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    .wishlist-image-wrapper {
      position: relative;
      height: 280px;
      background: #f8f5f3;
      overflow: hidden;
    }

    .wishlist-image-wrapper a {
      display: block;
      width: 100%;
      height: 100%;
    }

    .wishlist-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .wishlist-card:hover .wishlist-image {
      transform: scale(1.04);
    }

    .wishlist-remove-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: #c78e82;
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
      z-index: 5;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .wishlist-remove-btn:hover {
      transform: scale(1.08);
      background: #2b1e1c;
      color: #fff;
    }

    .wishlist-info {
      padding: 20px;
    }

    .wishlist-info h5 {
      font-size: 17px;
      font-weight: 600;
      color: #2b1e1c;
      margin-bottom: 8px;
      min-height: 42px;
    }

    .wishlist-price {
      font-size: 18px;
      font-weight: 700;
      color: #c78e82;
      margin-bottom: 16px;
    }

    .wishlist-actions {
      display: flex;
      gap: 8px;
    }

    .wishlist-cart-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: #2b1e1c;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .wishlist-cart-btn:hover {
      background: #c78e82;
    }

    .wishlist-delete-btn {
      width: 44px;
      border: none;
      border-radius: 10px;
      background: #f5eeee;
      color: #b34a4a;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .wishlist-delete-btn:hover {
      background: #b34a4a;
      color: #fff;
    }

    .wishlist-empty {
      text-align: center;
      padding: 80px 20px;
    }

    .wishlist-empty-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f7eeee;
      color: #c78e82;
      font-size: 38px;
      margin-bottom: 25px;
    }

    .wishlist-empty h3 {
      font-family: "Playfair Display", serif;
      color: #2b1e1c;
      margin-bottom: 10px;
    }

    .wishlist-empty p {
      color: #777;
      margin-bottom: 25px;
    }

    /* Navbar Wishlist Badge */

    .wishlist-nav-link {
      position: relative;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
    }

    .wishlist-nav-badge {
      position: absolute;
      top: 2px;
      right: 0;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 50px;
      background: #2b1e1c;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* Product Heart */

    .gl-wishlist-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.95);
      color: #2b1e1c;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .gl-wishlist-btn:hover {
      transform: scale(1.08);
    }

    .gl-wishlist-btn.wishlist-active {
      color: #c78e82;
    }

    .gl-wishlist-btn i {
      font-size: 18px;
    }

    @media (max-width: 767px) {

      .wishlist-section {
        padding: 50px 0;
      }

      .wishlist-image-wrapper {
        height: 250px;
      }

    }

  </style>


  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body data-page="wishlist">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
