<!doctype html>
<html lang="en" data-page="register">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gloriya Jewellery – Register</title>
  <meta name="description" content="Create an account at Gloriya — Handcrafted fine jewellery.">

  <!-- Favicons / OG (kept same) -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- CSS libs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght:600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="/style.css" rel="stylesheet"/>

  <style>
    /* Keep global layout intact — do not reflow header/footer */
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg,#f8f7f5 0%,#f2efec 100%);
      margin:0;
      color:#111;
    }

    /* Shell centers only the form, doesn't interfere with site chrome */
    .register-shell {
      min-height: calc(100vh - 140px); /* allowance for navbar/footer */
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 2.25rem 1rem;
      box-sizing: border-box;
    }

    .register-card {
      width:100%;
      max-width:520px;
      background: rgba(255,255,255,0.98);
      border-radius:12px;
      padding:1.6rem;
      border:1px solid rgba(0,0,0,0.04);
      box-shadow: 0 8px 24px rgba(15,15,15,0.06);
    }

    .brand { font-family: "Playfair Display", serif; display:flex; gap:.5rem; align-items:center; margin-bottom:.45rem; }
    .brand .dot { width:9px; height:9px; border-radius:50%; background:#b8860b; }

    input.form-control:focus { border-color:#b8860b; box-shadow:0 0 0 .12rem rgba(184,134,11,0.08); }
    .btn-modern { background: linear-gradient(90deg,#b8860b,#c49a2b); color:#fff; border-radius:8px; font-weight:600; padding:.55rem .9rem; border:0; }

    .field-error { color:#b00020; font-size:.9rem; margin-top:.35rem; display:none; }
    .field-error.visible { display:block; }

    .pw-strength { height:6px; border-radius:6px; background:#eee; overflow:hidden; margin-top:.45rem; }
    .pw-strength > i { display:block; height:100%; width:0%; transition: width .28s ease; background: linear-gradient(90deg, rgba(184,134,11,0.9), rgba(200,160,40,0.9)); }

    @media (max-width:576px) {
      .register-shell { padding:1rem; min-height: calc(100vh - 110px); }
      .register-card { padding:1rem; }
    }
  </style>

  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body data-page="register">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
