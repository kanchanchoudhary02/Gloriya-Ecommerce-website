<html lang="en" data-page="about">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <!-- Title & Basic SEO -->
  <title>Gloriya Jewellery – Modern Luxury</title>
  <meta name="description" content="Handcrafted fine jewellery — modern designs, certified stones and insured shipping.">

  <!-- Favicons (Updated with Logo) -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://gloriya.in/images/logo.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://gloriya.in/images/logo.png">
  <link rel="apple-touch-icon" href="https://gloriya.in/images/logo.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph (Social Sharing Preview) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gloriya Jewellery">
  <meta property="og:title" content="Gloriya Jewellery – Modern Luxury">
  <meta property="og:description" content="Handcrafted fine jewellery — modern designs, certified stones and insured shipping.">
  <meta property="og:image" content="https://gloriya.in/og/og-default.jpg">
  <meta property="og:url" content="https://gloriya.in/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gloriya Jewellery – Modern Luxury">
  <meta name="twitter:description" content="Handcrafted fine jewellery — modern designs, certified stones and insured shipping.">
  <meta name="twitter:image" content="https://gloriya.in/og/og-default.jpg">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght:600&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <!-- Site CSS -->
  <link href="/style.css" rel="stylesheet"/>

  <style>
    :root{
      --rose:#c78e82;
      --rose-2:#d8a6a0;
      --ink:#2b1e1c;
      --muted:#5e4a46;
      --panel:rgba(255,255,255,.85);
      --shadow:0 20px 50px rgba(0,0,0,.15);
    }
    body{ font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:var(--ink); }

    /* ===== Hero ===== */
    .hero-about{
      position: relative;
      min-height: clamp(420px, 60vh, 620px);
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #f7efe9;
      isolation: isolate;
    }
    .hero-about .bg{
      position:absolute; inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.15) 35%, rgba(0,0,0,.10) 55%, rgba(0,0,0,.35) 100%),
        url("https://images.unsplash.com/photo-1543294001-f7cd5d7fb516?q=80&w=1600&auto=format&fit=crop") center/cover no-repeat;
      z-index:-2;
      filter: saturate(110%);
    }
    .hero-about .panel{
      max-width: 980px;
      width: min(94%, 980px);
      border-radius: 22px;
      padding: clamp(18px, 3.5vw, 28px);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background:
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.86));
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.55);
    }
    .hero-about h1{
      font-family: "Playfair Display", serif;
      font-weight: 700;
      letter-spacing: .2px;
      line-height: 1.1;
      font-size: clamp(28px, 5.2vw, 52px);
      color: var(--ink);
      margin: 0 0 .4rem;
    }
    .hero-about p.lead{
      color: #3b2d2b;
      font-size: clamp(16px, 1.9vw, 18px);
      margin-bottom: 1rem;
    }
    .badge-row{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .soft-badge{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:1px solid #eadad7; color:#6b4a44;
      font-weight:600; font-size:13px;
      box-shadow: 0 6px 16px rgba(0,0,0,.08);
    }
    .btn-rose{
      display:inline-flex; align-items:center; gap:10px;
      border:none; border-radius:999px; padding:12px 18px;
      font-weight:700;
      background: linear-gradient(160deg, var(--rose-2), var(--rose));
      color:#2b1e1c;
      box-shadow: 0 10px 24px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.55);
      text-decoration:none;
    }
    .btn-rose:hover{ filter:brightness(.97); transform: translateY(-1px); }
    @media (prefers-reduced-motion: reduce){ .btn-rose{ transition:none; } }

    /* ===== Story Section ===== */
    .section-title{
      font-family: "Playfair Display", serif; font-weight:700;
      color:var(--ink);
    }
    .muted{ color: var(--muted); }

    .value-card{
      border:1px solid #efdfdb; border-radius:18px; padding:18px;
      height:100%; background:#fff;
      box-shadow: 0 8px 22px rgba(0,0,0,.06);
    }
    .value-card i{ color: var(--rose); }

    /* ===== Founder Block ===== */
    .founder-card{
      border-radius:24px; background:#fff; border:1px solid #efdfdb;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .founder-photo{
      width: 160px; height:160px; border-radius:50%;
      object-fit:cover; border:4px solid #fff; box-shadow: 0 8px 24px rgba(0,0,0,.12);
      background:#f4e8e6;
    }

    /* ===== CTA Band ===== */
    .cta-band{
      border-radius:28px; padding:28px; background:
        radial-gradient(120% 120% at 20% 20%, #fff, #f6ece8);
      border:1px solid #efdfdb; box-shadow: var(--shadow);
    }
  </style>

  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body data-page="about">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
