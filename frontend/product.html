<!doctype html>
<html lang="en" data-page="product">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product – Gloriya Jewellery</title>

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

    <link href="/style.css" rel="stylesheet" />
    <style>
      :root {
        --gold: #b8860b;
        --gold-light: #d4a017;
        --gold-pale: #f5e8c0;
        --ink: #1a1612;
        --muted: #6b5e4e;
        --surface: #fdfaf5;
        --border: #e8dcc8;
        --white: #ffffff;
      }

      body {
        background: var(--surface);
        font-family: 'Jost', sans-serif;
        font-weight: 300;
        color: var(--ink);
      }

      /* ── Breadcrumb ─────────────────────────────── */
      .gl-breadcrumb {
        background: var(--white);
        border-bottom: 1px solid var(--border);
        padding: 10px 0;
      }
      .breadcrumb { margin: 0; }
      .breadcrumb-item a {
        color: var(--muted);
        text-decoration: none;
        font-size: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .breadcrumb-item.active {
        color: var(--gold);
        font-size: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .breadcrumb-item + .breadcrumb-item::before {
        color: var(--border);
        content: "—";
      }

      /* ── Gallery ────────────────────────────────── */
      .gl-gallery-wrap {
        position: sticky;
        top: 20px;
      }
      .gl-mainimg {
        width: 100%;
        height: 520px;
        object-fit: cover;
        display: block;
        border-radius: 2px;
      }
      @media (max-width: 575.98px) {
        .gl-mainimg { height: 280px; }
        .gl-gallery-wrap { position: static; }
      }

      .gl-carousel-wrap {
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
        background: var(--white);
      }

      /* carousel controls custom */
      .carousel-control-prev,
      .carousel-control-next {
        width: 36px;
        height: 36px;
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--border);
        border-radius: 50%;
        top: 50%;
        transform: translateY(-50%);
        opacity: 1;
        bottom: auto;
      }
      .carousel-control-prev { left: 12px; }
      .carousel-control-next { right: 12px; }
      .carousel-control-prev-icon,
      .carousel-control-next-icon {
        filter: invert(1);
        width: 14px;
        height: 14px;
      }

      /* thumbs */
      .gl-thumbs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px;
        background: var(--white);
        border-top: 1px solid var(--border);
      }
      .gl-thumb {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 2px;
        cursor: pointer;
        border: 2px solid transparent;
        transition: border-color .2s;
        flex-shrink: 0;
      }
      .gl-thumb.active { border-color: var(--gold); }
      .gl-thumb-video {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        background: var(--ink);
        color: var(--white);
        border-radius: 2px;
        cursor: pointer;
        border: 2px solid transparent;
        flex-shrink: 0;
        transition: border-color .2s;
      }
      .gl-thumb-video.active { border-color: var(--gold); }

      /* ── Info panel ─────────────────────────────── */
      .gl-info-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 36px 32px;
      }
      @media (max-width: 767.98px) {
        .gl-info-card { padding: 24px 18px; }
      }

      .gl-product-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 2rem;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: .01em;
        color: var(--ink);
        margin-bottom: 6px;
      }

      .gl-category-badge {
        display: inline-block;
        font-size: 11px;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 2px;
        padding: 2px 10px;
        margin-bottom: 14px;
      }

      /* stars */
      .gl-stars { color: #c8a84b; font-size: 13px; }
      .gl-review-count { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

      /* divider */
      .gl-divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 18px 0;
      }

      /* stock */
      .gl-stock-in {
        font-size: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: #5a7a5a;
      }
      .gl-stock-out {
        font-size: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: #a04040;
      }
      .gl-stock-dot {
        display: inline-block;
        width: 7px; height: 7px;
        border-radius: 50%;
        margin-right: 6px;
        background: currentColor;
      }

      /* price */
      .gl-price-current {
        font-family: 'Cormorant Garamond', serif;
        font-size: 2.2rem;
        font-weight: 600;
        color: var(--gold);
        line-height: 1;
      }
      .gl-price-old {
        font-size: 1rem;
        color: #aaa;
        text-decoration: line-through;
        margin-left: 8px;
        font-family: 'Jost', sans-serif;
        font-weight: 300;
      }
      .gl-tax-note {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: .06em;
        text-transform: uppercase;
      }

      /* ── Buttons ────────────────────────────────── */
      .btn-gl-primary {
        background: var(--ink);
        color: var(--white);
        border: 1.5px solid var(--ink);
        border-radius: 2px;
        font-family: 'Jost', sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: .12em;
        text-transform: uppercase;
        padding: 12px 28px;
        transition: background .22s, color .22s;
      }
      .btn-gl-primary:hover {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--white);
      }

      .btn-gl-outline {
        background: transparent;
        color: var(--ink);
        border: 1.5px solid var(--border);
        border-radius: 2px;
        font-family: 'Jost', sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: .12em;
        text-transform: uppercase;
        padding: 12px 28px;
        transition: border-color .22s, color .22s;
      }
      .btn-gl-outline:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      .gl-action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 28px;
      }

      /* ── Description ────────────────────────────── */
      .gl-section-label {
        font-size: 11px;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
        font-weight: 500;
      }

      .gl-desc-text {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.75;
      }

      .gl-desc-collapse {
        max-height: 80px;
        overflow: hidden;
        position: relative;
        transition: max-height .4s ease;
      }
      .gl-desc-collapse.expanded {
        max-height: 2000px;
      }
      .gl-desc-collapse:not(.expanded)::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 40px;
        background: linear-gradient(transparent, var(--white));
      }

      .gl-read-more {
        background: none;
        border: none;
        color: var(--gold);
        font-size: 12px;
        letter-spacing: .1em;
        text-transform: uppercase;
        padding: 6px 0 0;
        cursor: pointer;
        font-family: 'Jost', sans-serif;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .gl-read-more:hover { color: var(--gold-light); }

      /* ── Shipping box ───────────────────────────── */
      .gl-shipping-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 16px 18px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.7;
      }
      .gl-shipping-box strong { color: var(--ink); font-weight: 500; }

      /* ── Suggested ──────────────────────────────── */
      .gl-suggested-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.6rem;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 20px;
        position: relative;
        padding-bottom: 12px;
      }
      .gl-suggested-title::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0;
        width: 40px;
        height: 1px;
        background: var(--gold);
      }

      .gl-sug-card {
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: 2px;
        overflow: hidden;
        transition: box-shadow .2s, transform .2s;
        background: var(--white);
      }
      .gl-sug-card:hover {
        box-shadow: 0 8px 24px rgba(184,134,11,.12);
        transform: translateY(-3px);
      }
      .gl-sug-card .gl-sug-img-wrap {
        aspect-ratio: 1;
        overflow: hidden;
      }
      .gl-sug-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform .35s;
      }
      .gl-sug-card:hover img { transform: scale(1.04); }
      .gl-sug-info {
        padding: 12px;
        border-top: 1px solid var(--border);
      }
      .gl-sug-name {
        font-size: 13px;
        color: var(--ink);
        min-height: 36px;
        line-height: 1.4;
      }
      .gl-sug-price {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--gold);
        margin-top: 4px;
      }

      /* ── Toast ──────────────────────────────────── */
      .cart-toast {
        position: fixed;
        right: 20px;
        bottom: 30px;
        background: var(--ink);
        color: var(--white);
        padding: 12px 18px;
        border-radius: 2px;
        z-index: 9999;
        font-size: 13px;
        letter-spacing: .04em;
        box-shadow: 0 8px 24px rgba(0,0,0,.28);
        border-left: 3px solid var(--gold);
        animation: slideIn .25s ease;
      }
      @keyframes slideIn {
        from { transform: translateX(60px); opacity: 0; }
        to   { transform: translateX(0);    opacity: 1; }
      }

      /* ── Misc ───────────────────────────────────── */
      main.gl-main { padding: 40px 0 60px; }
    </style>
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body data-page="product">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
