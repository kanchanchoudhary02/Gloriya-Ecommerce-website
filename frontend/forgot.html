<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password – Gloriya Jewellery"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/style.css" rel="stylesheet"></head><body><main class="container py-5" style="max-width:520px"><div class="card border-0 shadow p-4"><h2>Forgot Password</h2><p class="text-muted">Enter your account email and we’ll send a secure reset link.</p><form id="forgotForm"><input id="email" type="email" class="form-control mb-3" placeholder="Email address" required><button class="btn btn-dark w-100">Send Reset Link</button></form><div id="msg" class="mt-3"></div><a href="/login.html" class="d-inline-block mt-3">Back to Login</a></div></main><script>const API_BASE=window.API_BASE||'https://gloriya.in/api';document.getElementById('forgotForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Sending...';try{const r=await fetch(API_BASE+'/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const d=await r.json();msg.className='mt-3 '+(r.ok?'text-success':'text-danger');msg.textContent=d.msg||'Please try again.';}catch{msg.className='mt-3 text-danger';msg.textContent='Unable to contact the server.';}};</script></body></html>
